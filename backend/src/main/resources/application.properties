server.port=${PORT:4205}
server.address=${HOST:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55505/hookwatch}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:local-development-only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-message=never
